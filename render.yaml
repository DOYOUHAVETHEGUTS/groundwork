# Render Blueprint — New > Blueprint, point it at the repo. Secrets marked sync:false
# are entered once in the dashboard and never committed.
services:
  - type: web
    name: groundwork-intake
    runtime: python
    plan: free                      # pilot only: free disk is wiped on redeploy and sleep
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py     # binds 0.0.0.0:$PORT
    healthCheckPath: /healthz       # open endpoint, outside the login gate
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.3"
      # ---- Edition: v1 shared password | v2 named accounts | v3 Entra ID SSO ----
      - key: GW_EDITION
        value: v1
      - key: GW_APP_PASSWORD        # v1 password (blank = built-in default)
        sync: false
      - key: GW_SECRET_KEY          # signs sessions
        generateValue: true
      - key: GW_ADMIN_EMAIL         # v2: first admin, created on first boot
        sync: false
      - key: GW_ADMIN_PASSWORD
        sync: false
      # v3 only — uncomment once the Entra app registration exists
      # - key: GW_OIDC_ISSUER        # https://login.microsoftonline.com/<tenant-id>/v2.0
      #   sync: false
      # - key: GW_OIDC_CLIENT_ID
      #   sync: false
      # - key: GW_OIDC_CLIENT_SECRET
      #   sync: false
      # - key: GW_BREAKGLASS_EMAIL
      #   sync: false
      # - key: GW_ROLE_MAP           # JSON: Entra app role -> {role, division, group}
      #   sync: false
      # ---- Text model (rules engine runs without it) ----
      - key: GW_PROVIDER
        value: anthropic            # anthropic | openai | azure_openai | custom
      - key: GW_MODEL
        value: claude-sonnet-5
      - key: GW_BASE_URL
        value: https://api.anthropic.com
      - key: GW_API_KEY
        sync: false
      # ---- Example images (separate image API; off by default) ----
      - key: GW_IMAGE_PROVIDER
        value: none                 # none | openai | azure_openai
      - key: GW_IMAGE_API_KEY
        sync: false
      - key: GW_IMAGE_PER_REQUEST
        value: "4"
      - key: GW_IMAGE_MONTHLY_CAP
        value: "40"
      # ---- Finance escalation (free tier blocks SMTP: use log or webhook) ----
      - key: GW_ALERT_METHOD
        value: log
      - key: GW_FINANCE_EMAIL
        sync: false
      - key: GW_ALERT_WEBHOOK_URL
        sync: false
    # Persistent storage (paid plans) — needed before V2 holds real accounts:
    # disk:
    #   name: groundwork-data
    #   mountPath: /opt/render/project/src/data
    #   sizeGB: 1
